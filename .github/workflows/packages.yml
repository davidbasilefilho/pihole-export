name: Build and test release packages
on:
  workflow_call:
    inputs:
      suffix:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify series resolution and execution
        shell: bash
        run: |
          mise latest rust@1.100
          mise latest bun@1.4
          python scripts/check-toolchain.py
          rustup component list --installed
      - name: Linux graphics build and test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libxinerama1 libvulkan1 mesa-vulkan-drivers xvfb xclip xdotool
      - run: bun install --frozen-lockfile
      - run: mise run check
      - run: mise run test
      - run: mise run desktop-check
      - run: mise run compile
      - run: cargo build --release -p pihole-desktop --locked
      - name: Package both applications
        run: python scripts/package.py "${{ matrix.platform }}" "${{ inputs.suffix }}"
      - name: Run extracted GUI and headless TUI on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a sh -c 'python scripts/smoke-package.py && python scripts/native-paste.py' 
      - name: Run extracted GUI and headless TUI on macOS and Windows
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: python scripts/smoke-package.py
      - name: Real extracted TUI terminal interaction
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install pexpect==4.9.0 pyte==0.8.2
          python test/pty_export.py package-stage/tui/pihole-export
      - name: Windows standalone offline entry points
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          python -m pip install pywinpty==3.0.2 pyte==0.8.2
          python test/windows_offline.py package-stage/tui/pihole-export.exe package-stage/gui/pihole-desktop.exe
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform }}
          path: dist/pihole-export-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-smoke-${{ matrix.platform }}
          path: artifacts/package-smoke/
          if-no-files-found: warn
