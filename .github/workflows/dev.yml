name: Dev Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: bin/pihole-export
            extension: ""
          - os: macos-latest
            platform: darwin-arm64
            binary: bin/pihole-export
            extension: ""
          - os: windows-latest
            platform: windows-x64
            binary: bin/pihole-export.exe
            extension: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: mise run check

      - name: Compile
        run: mise run compile

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          SHORT_SHA="${GITHUB_SHA::7}"
          ASSET="pihole-export-v${VERSION}-${SHORT_SHA}-${{ matrix.platform }}${{ matrix.extension }}"
          mv "${{ matrix.binary }}" "$ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: pihole-export-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version package.json)"
          SHORT_SHA="${GITHUB_SHA::7}"

          gh release create "dev-${SHORT_SHA}" \
            artifacts/pihole-export-* \
            --target "$GITHUB_SHA" \
            --title "pihole-export v${VERSION} (${SHORT_SHA})" \
            --generate-notes \
            --prerelease