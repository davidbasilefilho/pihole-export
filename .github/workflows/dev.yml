name: Dev Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/packages.yml
    with:
      suffix: -dev-${{ github.sha }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: packages-*
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version package.json)"
          SHORT_SHA="${GITHUB_SHA::7}"

          gh release create "dev-${SHORT_SHA}" \
            artifacts/pihole-export-* \
            --target "$GITHUB_SHA" \
            --title "pihole-export v${VERSION} (${SHORT_SHA})" \
            --generate-notes \
            --prerelease
