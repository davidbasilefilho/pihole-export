name: Dev Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/packages.yml
    with:
      suffix: -dev-${{ github.sha }}

  release:
    needs: build
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: packages-*
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version package.json)"
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded main build $GITHUB_SHA"
            exit 0
          fi
          COMMIT_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          DISPLAY_DATE="$(date -u -d "$COMMIT_DATE" '+%Y-%m-%d %H:%M UTC')"
          SHORT_SHA="${GITHUB_SHA::7}"

          gh release create "dev-${SHORT_SHA}" \
            artifacts/pihole-export-* \
            --target "$GITHUB_SHA" \
            --title "${DISPLAY_DATE} · Pi-hole Export v${VERSION} (${SHORT_SHA})" \
            --generate-notes \
            --prerelease
