name: Stable Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: mise run check

      - name: Compile
        run: mise run compile

      - name: Prepare release
        id: release
        run: |
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"

          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

          ASSET="pihole-export-${VERSION}"
          mv bin/pihole-export "$ASSET"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.release.outputs.asset }}" \
            --verify-tag \
            --title "pihole-export ${{ steps.release.outputs.version }}" \
            --generate-notes \
            --latest