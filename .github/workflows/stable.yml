name: Stable Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: bin/pihole-export
            extension: ""
          - os: macos-latest
            platform: darwin-arm64
            binary: bin/pihole-export
            extension: ""
          - os: windows-latest
            platform: windows-x64
            binary: bin/pihole-export.exe
            extension: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: mise run check

      - name: Compile
        run: mise run compile

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          ASSET="pihole-export-v${VERSION}-${{ matrix.platform }}${{ matrix.extension }}"
          mv "${{ matrix.binary }}" "$ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: pihole-export-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate version
        id: version
        run: |
          VERSION="$(jq -r .version package.json)"

          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/pihole-export-* \
            --verify-tag \
            --title "pihole-export v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest