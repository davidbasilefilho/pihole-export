[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy,rust-analyzer" }
bun = "1.4.5"
hk = "2.14.0"

[tasks.dev]
run = "cargo build -p pihole-backend --locked && bun run dev"
[tasks.test]
run = "cargo test --locked && cargo build -p pihole-backend --locked && bun test"
[tasks.check]
run = "cargo fmt --all -- --check && cargo clippy --locked --all-targets -- -D warnings && bun run check"
[tasks.compile]
run = "cargo build --release -p pihole-backend --locked && bun run compile"
[tasks.desktop]
run = "cargo run -p pihole-desktop --locked"
[tasks.desktop-check]
run = "cargo clippy -p pihole-desktop --all-targets --locked -- -D warnings && cargo test -p pihole-desktop --locked"
[tasks.hooks]
run = "hk install --mise"
