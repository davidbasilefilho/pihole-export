[workspace]
resolver = "3"
members = ["crates/pihole-core", "crates/pihole-backend", "crates/pihole-desktop", "crates/pihole-platform", "crates/pihole-launcher"]
default-members = ["crates/pihole-core", "crates/pihole-backend"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "time"] }
tokio-util = "0.7"

[profile.dev]
debug = 0

[profile.test]
debug = 0

# Rune upstream requires consumers to apply these patches at the same revision.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "0b8714f102431f884757786cff344d53ec9bcc53" }
naga = { git = "https://github.com/anomalyco/rune", rev = "0b8714f102431f884757786cff344d53ec9bcc53" }
winit = { git = "https://github.com/anomalyco/rune", rev = "0b8714f102431f884757786cff344d53ec9bcc53" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "0b8714f102431f884757786cff344d53ec9bcc53" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "0b8714f102431f884757786cff344d53ec9bcc53" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0b8714f102431f884757786cff344d53ec9bcc53" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "0b8714f102431f884757786cff344d53ec9bcc53" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "0b8714f102431f884757786cff344d53ec9bcc53" }
